<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrendPilot AI</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16191f;--muted:#5d6675;--line:#e1e5eb;--accent:#3b4cca;--accent-ink:#fff;--ok:#12784a;--ok-bg:#e3f5ec;--warn:#8f5a00;--warn-bg:#fdf0d8;--bad:#b3261e;--bad-bg:#fbe6e4}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--card:#191d24;--ink:#e9ecf1;--muted:#a0a9b8;--line:#2c323c;--accent:#8c9bff;--accent-ink:#10131a;--ok:#6fdcaa;--ok-bg:#163427;--warn:#f2c26b;--warn-bg:#3a2c10;--bad:#ff9d94;--bad-bg:#40201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
nav{display:flex;gap:4px;padding:8px 20px 0;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:8px 12px;font-weight:600}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:16px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}
button{font:inherit;font-weight:600;padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 20px;font-size:13px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.step{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;font-weight:600}
.step.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
td.n{font-variant-numeric:tabular-nums;text-align:right}
a{color:var(--accent)}
textarea{width:100%;min-height:150px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);flex:1;min-width:180px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.meta{color:var(--muted);font-size:13px}
.notes{font-size:13px;margin:8px 0}
.empty{color:var(--muted);padding:6px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(560px,92vw);padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;display:none}
</style>
</head>
<body>
<header>
  <div><h1>TrendPilot AI</h1><div class="sub">Independent interview prototype, not affiliated with Dots-In</div></div>
  <span class="tag warn">Dry run: nothing is really posted</span>
  <span class="tag" id="model"></span>
  <span class="spacer"></span>
  <button class="primary" id="run">Run pipeline</button>
</header>
<div class="banner" id="banner" hidden></div>
<nav role="tablist" id="tabs"></nav>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Everything from the API goes through textContent, so external titles can never run as HTML.
const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (v !== undefined && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) e.append(kid);
  return e;
};
const api = async (url, body) => {
  const r = await fetch(url, body === undefined ? {} : {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Request failed');
  return data;
};
const toast = msg => { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 6000); };
const link = url => /^https:\/\//.test(url) ? h('a', {href: url, target: '_blank', rel: 'noopener noreferrer'}, 'source') : 'no link';
const STATUS = {needs_review: 'warn', approved: 'ok', published: 'ok', rejected: 'bad', done: 'ok', failed: 'bad', running: 'warn', qualified: 'ok'};
const tag = s => h('span', {class: 'tag ' + (STATUS[s] || '')}, s.replace('_', ' '));
const STEPS = ['Collect Hacker News', 'Collect arXiv', 'Trend Scout', 'Relevance Strategist', 'Content Studio', 'Brand Review'];
const TABS = {Pipeline: pipeline, Trends: trends, Content: content, Audit: audit, Memory: memory};
let tab = 'Pipeline', running = false;

async function pipeline() {
  const [runs, log] = await Promise.all([api('/api/runs'), api('/api/audit')]);
  const r = runs[0];
  if (!r) return [h('div', {class: 'card'}, h('p', {class: 'empty'}, 'No runs yet. Press Run pipeline to start.'))];
  const rows = log.filter(a => a.run_id === r.id);
  const started = new Set(rows.filter(a => a.action === 'step_start').map(a => a.target));
  const agents = {};
  for (const a of rows.filter(a => a.action === 'agent_run')) {
    const x = agents[a.actor] ||= {calls: 0, i: 0, o: 0, ms: 0};
    x.calls++; x.i += a.input_tokens; x.o += a.output_tokens; x.ms += a.duration_ms;
  }
  const denied = rows.filter(a => !a.allowed && a.action !== 'finished').length;
  return [
    h('div', {class: 'card'},
      h('div', {class: 'row', style: 'margin:0 0 12px'}, h('h2', {style: 'margin:0'}, `Run ${r.id}`), tag(r.status), h('span', {class: 'meta'}, r.message || 'Working...')),
      h('div', {class: 'steps'}, STEPS.map(s => h('div', {class: 'step' + (started.has(s) ? ' done' : '')}, s))),
      h('div', {class: 'stats'},
        h('div', {class: 'stat'}, h('b', {}, r.input_tokens.toLocaleString()), h('span', {}, 'input tokens')),
        h('div', {class: 'stat'}, h('b', {}, r.output_tokens.toLocaleString()), h('span', {}, 'output tokens')),
        h('div', {class: 'stat'}, h('b', {}, '$' + r.cost_usd.toFixed(4)), h('span', {}, 'estimated cost')),
        h('div', {class: 'stat'}, h('b', {}, String(denied)), h('span', {}, 'harness blocks')))),
    h('div', {class: 'card'}, h('h2', {}, 'Agents'), h('div', {class: 'wrap'}, h('table', {},
      h('thead', {}, h('tr', {}, ['Agent', 'Calls', 'Input', 'Output', 'Seconds'].map(c => h('th', {}, c)))),
      h('tbody', {}, Object.entries(agents).map(([n, x]) => h('tr', {}, h('td', {}, n), h('td', {class: 'n'}, String(x.calls)), h('td', {class: 'n'}, x.i.toLocaleString()), h('td', {class: 'n'}, x.o.toLocaleString()), h('td', {class: 'n'}, (x.ms / 1000).toFixed(1))))))))
  ];
}

async function trends() {
  const list = await api('/api/trends');
  if (!list.length) return [h('div', {class: 'card'}, h('p', {class: 'empty'}, 'No scored trends yet.'))];
  list.sort((a, b) => b.id - a.id || b.score - a.score);
  return [h('div', {class: 'card'}, h('h2', {}, 'Scored trends'),
    h('p', {class: 'meta'}, 'Score = 0.30 Relevance + 0.25 Brand fit + 0.20 Momentum + 0.15 Evidence + 0.10 Content. Momentum is computed by code from real engagement, the rest by the Relevance Strategist.'),
    h('div', {class: 'wrap'}, h('table', {},
      h('thead', {}, h('tr', {}, ['Topic', 'Score', 'R', 'B', 'M', 'E', 'C', 'Status', ''].map(c => h('th', {}, c)))),
      h('tbody', {}, list.map(t => h('tr', {},
        h('td', {}, h('strong', {}, t.topic || t.title), h('div', {class: 'meta'}, `${t.pillar} · ${t.source}`), h('div', {class: 'meta'}, t.reason)),
        h('td', {class: 'n'}, h('strong', {}, t.score.toFixed(1))),
        [t.relevance, t.brand_fit, t.momentum, t.evidence, t.content_potential].map(v => h('td', {class: 'n'}, String(v))),
        h('td', {}, tag(t.status)), h('td', {}, link(t.source_url)))))))) ];
}

async function act(fn, done) { try { const r = await fn(); if (done) toast(done(r)); render(); } catch (e) { toast('Blocked: ' + e.message); render(); } }

function draftCard(d) {
  const open = d.status === 'needs_review';
  const box = h('textarea', {'aria-label': `Text of ${d.platform} draft ${d.id}`, readonly: !open});
  box.value = d.body;
  const reason = h('input', {'aria-label': 'Reason for rejecting', placeholder: 'Reason for rejecting (agents learn from this)'});
  const edit = () => box.value !== d.body ? api(`/api/content/${d.id}/edit`, {body: box.value}) : Promise.resolve();
  return h('div', {class: 'card'},
    h('div', {class: 'row', style: 'margin:0 0 6px'}, h('h2', {style: 'margin:0;text-transform:capitalize'}, d.platform), tag(d.status),
      h('span', {class: 'tag ' + (d.review_passed ? 'ok' : 'bad')}, d.review_passed ? `Review passed ${d.review_score}` : 'Flagged by review'), d.edited ? h('span', {class: 'tag'}, 'Edited') : null),
    h('div', {class: 'meta'}, `${d.topic} · ${d.pillar} · score ${d.score.toFixed(1)} · `, link(d.source_url)),
    h('p', {class: 'notes'}, d.review_notes || ''),
    box,
    h('div', {class: 'row'},
      open ? h('button', {onclick: () => act(() => edit().then(() => api(`/api/content/${d.id}/approve`, {reviewer: 'bhuvan'})), () => 'Approved')}, 'Approve') : null,
      d.status !== 'published' ? h('button', {class: 'primary', onclick: () => act(() => api(`/api/publish/${d.id}`, {}), p => `Dry run recorded as ${p.external_id}. Nothing was posted.`)}, 'Publish') : null,
      open ? reason : null,
      open ? h('button', {onclick: () => act(() => api(`/api/content/${d.id}/reject`, {reviewer: 'bhuvan', comment: reason.value}), () => 'Rejected and saved to learning memory')}, 'Reject') : null));
}

async function content() {
  const list = await api('/api/content');
  return list.length ? list.map(draftCard) : [h('div', {class: 'card'}, h('p', {class: 'empty'}, 'No drafts yet.'))];
}

async function audit() {
  const list = await api('/api/audit');
  return [h('div', {class: 'card'}, h('h2', {}, 'Audit trail'), h('div', {class: 'wrap'}, h('table', {},
    h('thead', {}, h('tr', {}, ['Time', 'Actor', 'Action', 'Target', 'Result', 'Detail'].map(c => h('th', {}, c)))),
    h('tbody', {}, list.map(a => h('tr', {}, h('td', {}, a.ts.slice(11, 19)), h('td', {}, a.actor), h('td', {}, a.action), h('td', {}, a.target),
      h('td', {}, h('span', {class: 'tag ' + (a.allowed ? 'ok' : 'bad')}, a.allowed ? 'allowed' : 'blocked')), h('td', {class: 'meta'}, a.detail))))))) ];
}

async function memory() {
  const m = await api('/api/memory');
  return [h('div', {class: 'card'}, h('h2', {}, 'Learning memory'), h('p', {style: 'white-space:pre-wrap'}, m.learnings)),
    h('div', {class: 'card'}, h('h2', {}, 'Brand memory'), h('p', {class: 'meta'}, "Public statements from the company's website, unverified and not reviewed by Dots-In."),
      h('div', {class: 'wrap'}, h('table', {}, h('tbody', {}, m.brand.map(b => h('tr', {}, h('td', {}, h('strong', {}, b.pillar)), h('td', {}, b.content))))))) ];
}

async function render() {
  const tabs = document.getElementById('tabs');
  tabs.replaceChildren(...Object.keys(TABS).map(t => h('button', {role: 'tab', 'aria-selected': String(t === tab), onclick: () => { tab = t; render(); }}, t)));
  try { document.getElementById('view').replaceChildren(...await TABS[tab]()); } catch (e) { toast(e.message); }
}

async function poll() {
  const s = await api('/api/status');
  document.getElementById('model').textContent = s.provider === 'mock' ? 'Mock mode' : s.model;
  const banner = document.getElementById('banner');
  banner.hidden = s.provider !== 'mock' && s.key_configured;
  banner.textContent = s.provider === 'mock' ? 'Mock mode: all trends, scores and drafts on this page are canned data.' : 'ANTHROPIC_API_KEY is missing from trendpilot/.env';
  document.getElementById('run').disabled = s.running;
  document.getElementById('run').textContent = s.running ? 'Running...' : 'Run pipeline';
  const finished = running && !s.running;
  running = s.running;
  if (finished) { toast('Run finished'); render(); }
  // Only live views refresh during a run, so a draft being edited is never overwritten.
  else if (running && (tab === 'Pipeline' || tab === 'Audit')) render();
}

document.getElementById('run').addEventListener('click', async () => {
  try { await api('/api/pipeline/run', {}); tab = 'Pipeline'; running = true; render(); poll(); } catch (e) { toast(e.message); }
});
render(); poll(); setInterval(poll, 1500);
</script>
</body>
</html>
